{% extends "base.html" %}
{% block content %}

<style>
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 30px;
    padding: 45px 25px;
    max-width: 1450px;
    margin: auto;
  }

  .card {
    background: #252536;
    border-radius: 16px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.25);
    overflow: hidden;
    transition: .3s;
    border: 1px solid #39394d;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }

  .card-title {
    font-family: sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: #f1f1f7;
    padding: 20px;
    margin: 0;
    border-bottom: 3px solid #8057df;
  }

  .video-container {
    position: relative;
    padding-top: 56.25%;
    background: #171722;
  }

  .video-container iframe,
  .video-container video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .video-container video {
    object-fit: contain;
  }

  @media (max-width: 600px) {
    .video-grid {
      grid-template-columns: 1fr;
      padding: 20px 12px;
    }
  }
</style>

<div class="video-grid">
  {% for video in videos %}
  <div class="card">

    <h3 class="card-title">{{ video.titulo }}</h3>

    <div class="video-container">

      {% if video.tipo == 'facebook' %}
        <iframe
          src="https://www.facebook.com/plugins/video.php?href={{ video.embed_url | urlencode }}&show_text=false"
          loading="lazy"
          allowfullscreen>
        </iframe>

      {% else %}
        <iframe src="{{ video.embed_url }}"
                title="{{ video.titulo }}"
                loading="lazy"
                allowfullscreen>
        </iframe>
      {% endif %}

    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
