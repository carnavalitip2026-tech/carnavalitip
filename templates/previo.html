{% extends "base.html" %}
{% block content %}
<style>
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 30px;
    padding: 45px 25px;
    max-width: 1450px;
    margin: auto;
  }

  .card {
    background: #252536;
    border-radius: 16px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.25);
    overflow: hidden;
    transition: .3s;
    border: 1px solid #39394d;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }

  .card-title {
    font-family: sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: #f1f1f7;
    padding: 20px;
    margin: 0;
    border-bottom: 3px solid #8057df;
  }

  .video-container {
    position: relative;
    padding-top: 56.25%;
    background: #171722;
  }

  .video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* Estilos para el visor de pantalla completa (Modal) */
  .modal-imagen {
    display: none;
    position: fixed;
    z-index: 1050;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    text-align: center;
  }
  .modal-imagen img {
    max-width: 90%;
    max-height: 85%;
    margin-top: 5%;
    border-radius: 8px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.5);
  }
  .cerrar-modal {
    position: absolute;
    top: 20px;
    right: 40px;
    color: #fff;
    font-size: 45px;
    font-weight: bold;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .video-grid {
      grid-template-columns: 1fr;
      padding: 20px 12px;
    }
  }
</style>

<div class="video-grid">
  {% for video in videos %}
  <div class="card">
    <h3 class="card-title">{{ video.titulo }}</h3>
    <div class="video-container">
      <iframe src="{{ video.embed_url }}"
              title="{{ video.titulo }}"
              loading="lazy"
              allowfullscreen></iframe>
    </div>
  </div>
  {% endfor %}
</div>

<div class="container py-4">
    <div class="row g-3">

        {% for imagen in imagenes %}
        {% set img_url = url_for('static', filename='img/previo/' + imagen.url) %}
        <div class="col-md-4">
            <div class="card shadow">
                <img src="{{ img_url }}"
                     class="card-img-top" style="height: 280px; object-fit: cover;" alt="{{ imagen.titulo }}">
                
                <div class="card-body">
                    <h5>{{ imagen.titulo }}</h5>
                    
                    <!-- Botones de Ampliar y Descargar -->
                    <div class="d-flex gap-2 mt-3">
                        <button class="btn btn-outline-light btn-sm w-50" onclick="ampliarImagen('{{ img_url }}')">
                            Ampliar
                        </button>
                        <a href="{{ img_url }}" download="{{ imagen.titulo | default('imagen') }}.jpg" class="btn btn-primary btn-sm w-50">
                            Descargar
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

<!-- Modal global para mostrar la imagen ampliada -->
<div id="modalZoom" class="modal-imagen" onclick="cerrarModal()">
    <span class="cerrar-modal">&times;</span>
    <img id="imgAmpliadaSrc" src="">
</div>

<script>
  function ampliarImagen(url) {
      document.getElementById('imgAmpliadaSrc').src = url;
      document.getElementById('modalZoom').style.display = 'block';
  }

  function cerrarModal() {
      document.getElementById('modalZoom').style.display = 'none';
  }
</script>

{% endblock %}
